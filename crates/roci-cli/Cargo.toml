[package]
name = "roci-cli"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true

[[bin]]
name = "roci-agent"
path = "src/main.rs"

[dependencies]
url = "2"
roci = { path = "../..", features = [
  "agent",
  "audio",
  "mcp",
  "github-copilot",
  "grok",
  "cursor",
] }
roci-tools = { path = "../roci-tools", features = ["agent"] }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
crossterm = "0.29"
directories = "6"
serde = "1"
serde_json = "1"

[features]
default = ["openai-compatible"]
# Enables the openai-compatible factory so `auth configure openai-compatible` works.
openai-compatible = ["roci/openai-compatible"]

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
wiremock = "0.6"
