[package]
name = "roci-providers"
version = "0.1.0"
edition = "2021"
description = "Built-in provider transports and OAuth flows for Roci"
license = "MIT"
rust-version.workspace = true

[dependencies]
roci-core = { path = "../roci-core" }
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls", "http2"], default-features = false }
tokio = { version = "1", features = ["sync", "time", "rt", "macros"] }
prost = { version = "0.13", optional = true }
prost-types = { version = "0.13", optional = true }
prost-reflect = { version = "0.14", features = ["serde"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
futures = "0.3"
async-stream = "0.3"
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.22"
sha2 = "0.10"
strum = { version = "0.27", features = ["derive"] }
directories = "6"

[dev-dependencies]
h2 = "0.4"
bytes = "1"
http = "1"
wiremock = "0.6"
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }

[features]
default = ["openai", "anthropic", "google"]
openai = []
anthropic = []
google = []
openai-compatible-transport = ["openai"]
github-copilot = ["openai-compatible-transport"]
grok = ["openai"]
cursor = ["dep:prost", "dep:prost-types", "dep:prost-reflect"]
groq = ["openai"]
mistral = ["openai"]
ollama = ["openai"]
lmstudio = ["openai"]
azure = ["openai"]
openrouter = ["openai"]
together = ["openai"]
openai-compatible = ["openai-compatible-transport"]
anthropic-compatible = ["anthropic"]
all-providers = [
    "openai", "anthropic", "google", "github-copilot", "grok", "cursor", "groq", "mistral",
    "ollama", "lmstudio", "azure", "openrouter", "together",
    "openai-compatible", "anthropic-compatible",
]
